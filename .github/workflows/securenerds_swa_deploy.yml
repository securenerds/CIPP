name: Secure Nerds CIPP frontend deploy

# Builds the CIPP frontend from this fork's main branch and uploads it to the
# Static Web App in Azure RG "CIPP" (MCPP subscription). The deploy key lives only
# in the AZURE_STATIC_WEB_APPS_API_TOKEN_CIPP repo secret (set from az, 2026-11-17).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build and deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CIPP }}
          action: upload
          app_location: "/"
          api_location: ""
          output_location: "/out"
